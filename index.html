<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {
      // localStorage puede lanzar en contextos restringidos (p.ej. abrir el archivo directo en algunos navegadores)
    }
  </script>
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">RECORDS</span>
          <ol id="records-list" class="records-list"></ol>
          <button id="reset-records-btn" class="records-btn">Borrar récords</button>
        </div>

        <div class="panel-section">
          <span class="label">MEJOR COMBO</span>
          <span class="value" id="best-combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">MÁS LÍNEAS</span>
          <span class="value" id="max-lines">0</span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="new-record-form" class="new-record-form hidden">
          <label for="player-name-input">¡Nuevo récord! Ingresá tu nombre:</label>
          <input type="text" id="player-name-input" maxlength="12" autocomplete="off" />
          <button id="save-record-btn" class="records-btn">Guardar</button>
        </div>
        <div id="overlay-records-section" class="panel-section overlay-records-section hidden">
          <span class="label">RECORDS</span>
          <ol id="overlay-records-list" class="records-list"></ol>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
