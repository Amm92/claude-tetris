<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {
      // localStorage puede lanzar en contextos restringidos (p.ej. abrir el archivo directo en algunos navegadores)
    }
  </script>
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="name-form" class="name-form hidden">
          <label for="player-name">¡Entras en el top! Escribe tu nombre:</label>
          <div class="name-form-row">
            <input id="player-name" type="text" maxlength="12" autocomplete="off" placeholder="Jugador" />
            <button type="submit" id="save-score-btn">Guardar</button>
          </div>
        </form>

        <div id="records-box" class="records">
          <div class="records-header">
            <span class="label">RECORDS</span>
            <button id="reset-records-btn" type="button">Resetear</button>
          </div>
          <ol id="records-list" class="records-list"></ol>
          <div class="records-extra">
            <span>Mejor combo: <strong id="rec-combo">0</strong></span>
            <span>Líneas máx.: <strong id="rec-maxlines">0</strong></span>
          </div>
        </div>

        <button id="restart-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
